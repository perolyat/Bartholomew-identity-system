[mypy]
python_version = 3.13
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
# bartholomew_api_bridge_v0_1/ has no __init__.py at its own root (only its
# subpackages do), so without an explicit base, mypy's default module-name
# resolution walks the same files via more than one path and reports them as
# duplicate/re-found modules. explicit_package_bases (+ mypy_path pointing at
# the repo root) makes module-name computation deterministic: walk up from
# each file only through __init__.py-containing directories, stop at the
# first one that has none, and name the module relative to that base.
explicit_package_bases = True
mypy_path = .
exclude = (?x)(
    ^\.venv/
    | ^\.pytest_cache/
    | ^\.ruff_cache/
    | ^\.mypy_cache/
    | ^__pycache__/
    | ^build/
    | ^dist/
    | ^\.eggs/
    | ^.*\.egg-info/
    # Legacy shim expecting cwd == bartholomew_api_bridge_v0_1/ ("from
    # services.api.app import app"), already excluded from the import-surface
    # contract in tests/smoke/test_packaging_contract.py's
    # KNOWN_NON_IMPORTABLE. It collides on module name "app" with the
    # supported root-level app.py under mypy's default (non-namespace)
    # module resolution.
    | ^bartholomew_api_bridge_v0_1/app\.py$
    # Neither the repo-root conftest.py nor tests/ is an __init__.py-anchored
    # package, so both conftest.py files resolve to the same bare top-level
    # module name "conftest" under mypy's default module resolution. Pytest
    # fixture files gain little from type-checking, so skip the nested one
    # rather than adding packaging (__init__.py in tests/) purely for mypy's
    # benefit.
    | ^tests/conftest\.py$
  )
