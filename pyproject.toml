[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bartholomew"
version = "0.0.1"
description = "Bartholomew AI - Proactive assistant kernel"
authors = [
    {name = "Taylor Paul", email = "tpaul733@gmail.com"}
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    # Upper bound raised for CVE-2026-54283 / GHSA-82w8-qh3p-5jfq (Starlette
    # request.form() resource-exhaustion via unbounded application/x-www-form-urlencoded
    # bodies, fixed in 1.3.1): fastapi<0.133 cannot resolve any patched Starlette
    # at all. Re-verify this ceiling before raising it further.
    "fastapi>=0.134,<0.141",
    # Starlette is a TRANSITIVE dependency of fastapi (not imported directly
    # by this project) but is pinned explicitly here as a REQUIRED SECURITY
    # FLOOR: fastapi>=0.134 only requires starlette>=0.46.0, which still
    # permits pre-fix resolver outcomes anywhere in [0.46.0, 1.3.1). This line
    # exists solely to make CVE-2026-54283 / GHSA-82w8-qh3p-5jfq unresolvable
    # by pip, not because the project uses Starlette's API directly. Do not
    # remove this line when bumping fastapi again without first re-verifying
    # that fastapi's OWN constraint has independently caught up to >=1.3.1 —
    # until it has, this line is the only thing enforcing the floor.
    "starlette>=1.3.1,<2.0",
    "uvicorn[standard]>=0.24",
    "pydantic[email]>=2.6",
    "python-dateutil>=2.8",
    "tzdata>=2023.3",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "tenacity>=8.2",
    "pyyaml>=6.0.1",
    "prometheus_client>=0.20.0",
    "keyring>=24.0",
    "numpy>=2.1,<3",
    "cryptography>=42.0",
    "jsonschema>=4.25,<5",
    "typer>=0.15",
    "rich>=13.7",
    "requests>=2.31",
]

[project.scripts]
bartholomew = "bartholomew.cli:main"
bartholomew-backfill-fts = "scripts.backfill_fts:main"

[tool.uvicorn]
factory = false

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PL",  # pylint
]
# TODO(bartholomew:S1/S2): remove PLR09xx ignores after refactoring hot paths
ignore = [
    "E501",   # line too long (handled by black)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "PLR0912", # too many branches (temporary)
    "PLR0915", # too many statements (temporary)
    "PLR0911", # too many returns (temporary)
    "B008",   # typer.Option pattern (temporary)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"identity_interpreter/models.py" = ["N801"]  # Allow Identity_ for disambiguation
"tests/**" = ["PLC0415", "E402", "B017", "E722", "C401", "PLR0912", "PLR0915"]  # pragmatic test rules
"scripts/**" = ["PLC0415"]  # Allow lazy imports in scripts
"**/cli.py" = ["PLC0415"]  # Allow lazy imports in CLI tools for fast startup
"conftest.py" = ["PLC0415"]  # Lazy imports in test fixtures
"test_*.py" = ["PLC0415"]  # Lazy imports in root-level tests
"cleanup_*.py" = ["PLC0415"]  # Lazy imports in utility scripts
"bartholomew/kernel/**" = ["PLC0415", "PLR0912", "PLR0915", "PLW0603"]  # Lazy imports for optional deps + temp complexity
"bartholomew_api_bridge_v0_1/**" = ["PLC0415", "PLW0603"]  # Lazy imports + global metrics
"identity_interpreter/orchestrator/**" = ["PLC0415"]  # Lazy imports for optional dependencies
"identity_interpreter/adapters/sight/**" = ["PLC0415"]  # Lazy imports for optional vision deps
"identity_interpreter/adapters/voice_io/**" = ["PLC0415"]  # Lazy imports for optional audio deps

[tool.ruff.lint.isort]
known-first-party = ["identity_interpreter"]
force-single-line = false
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q -m 'not integration and not slow'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Safety net, not a fix: tests that spin up a KernelDaemon (its own background
# scheduler thread) via FastAPI's TestClient share the default SQLite DB path,
# so running more than one in the same session can deadlock on file locks
# during shutdown. "thread" method is required here because the hang is a
# cross-thread wait (main thread blocked on a TestClient shutdown portal call
# into a daemon thread) that plain SIGALRM won't reliably interrupt.
timeout = 120
timeout_method = "thread"
markers = [
    "integration: long/slow external-ish tests",
    "slow: expensive tests",
    "smoke: fast sanity checks",
    "asyncio: mark test as async",
    "unit: fast unit tests",
]
