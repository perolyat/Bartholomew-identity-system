version: '3.8'

services:
  api:
    build: .
    container_name: bartholomew-api
    ports:
      # Loopback only. "5173:5173" would publish on every host interface.
      # The service is authenticated and TLS-only since S8, but loopback
      # publishing stays part of the decided container posture: defence in
      # depth, not a substitute for either. See the Dockerfile.
      - "127.0.0.1:5173:5173"
    environment:
      - ALLOWED_ORIGINS=https://localhost:5173,https://127.0.0.1:5173
      - TZ=Australia/Brisbane
      # S8 container posture (2026-08-27): authenticated, TLS-only, bound to
      # one provisioned personal Bartholomew. Startup refuses if any of these
      # is missing or disagrees -- there is no topology-assertion bypass.
      #
      # Provide these from your environment or a .env file; the image ships
      # no key material and no account:
      #
      #   BARTH_API_TLS_CERTFILE / BARTH_API_TLS_KEYFILE
      #       paths *inside the container* to mounted TLS material.
      #   BARTH_RUNTIME_USER_ID
      #       a user_id from `bartholomew accounts list`.
      #   BARTH_DB_PATH / BARTHO_MEMORY_KEYRING_SERVICE
      #       that user's own database and keyring namespace, as printed by
      #       the provisioning step in docs/S8_ALPHA_OPERATOR_GUIDE.md.
      - BARTH_API_TLS_CERTFILE=${BARTH_API_TLS_CERTFILE:?TLS certificate required}
      - BARTH_API_TLS_KEYFILE=${BARTH_API_TLS_KEYFILE:?TLS key required}
      - BARTH_RUNTIME_USER_ID=${BARTH_RUNTIME_USER_ID:?bound runtime user required}
      - BARTH_DB_PATH=${BARTH_DB_PATH:?bound user database required}
      - BARTHO_MEMORY_KEYRING_SERVICE=${BARTHO_MEMORY_KEYRING_SERVICE:?bound user keyring required}
    volumes:
      # Persist SQLite databases (control plane and per-user runtimes)
      - ./data:/app/data
      # Mount TLS material read-only. The image ships no key.
      - ${BARTH_TLS_DIR:-./tls}:/app/tls:ro
    restart: unless-stopped
    healthcheck:
      # https, and -k because Alpha TLS material is typically self-signed:
      # the healthcheck proves the service answers, not that a CA vouches.
      test: ["CMD", "curl", "-fk", "https://localhost:5173/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
