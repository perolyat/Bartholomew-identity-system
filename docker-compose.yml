version: '3.8'

services:
  api:
    build: .
    container_name: bartholomew-api
    ports:
      # Loopback only. "5173:5173" would publish on every host interface, and
      # this API has no authentication -- see DECISIONS.md and the Dockerfile.
      - "127.0.0.1:5173:5173"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - TZ=Australia/Brisbane
    volumes:
      # Persist SQLite databases
      - ./data:/app/data
    # Docker is the supervisor here, the same role systemd plays in
    # deploy/bartholomew.service. Bartholomew does not restart itself.
    restart: unless-stopped
    # KernelDaemon.stop() drains, cancels background work and checkpoints the
    # WAL; the 10s default would SIGKILL partway through that.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
