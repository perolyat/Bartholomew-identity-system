# Wave 3 (W03) — authoritative machine-readable coordination manifest
#
# This file is the single source of truth for Wave 3 session identity, ownership,
# dependencies, shared contracts, required CI tier, status and integration order.
# It is validated in the PR Fast CI tier by tests/test_wave_manifest.py. A later
# builder or integration session should be able to orient itself from this file
# and the contract documents it references, without the chat history that
# produced them.
#
# Naming is immutable metadata (see docs/waves/W03/README.md):
#   session id   W03-<X>
#   branch       wave/w03-<x>-<slug>
#   PR           [W03-<X>] <Semantic Name>
#   handoff      BARTHOLOMEW_W03_<X>_HANDOFF.md

wave:
  id: W03
  objective: >-
    Turn the infrastructure now present in Bartholomew into a genuinely useful
    closed-loop Windows agent that can perceive the PC environment, understand a
    user's intention and current state, construct a governed plan, safely act
    through authorized capabilities, verify what actually happened, and learn
    from explicitly governed corrections. Target loop:
    Observe -> Interpret -> Decide -> Govern -> Act -> Verify -> Learn.
  baseline:
    # The wave-two baseline is now MERGED to main. main @ 99ee734 carries all of
    # packages A-E (A canonical event backbone, B governed Windows actuation,
    # C multimodal presence, D learning/memory control centre, E device registry
    # & trusted groups) plus the companion-completion repairs (authentication, an
    # operator-reachable device consent channel, an arming window, one DB path
    # resolver). PR #89 merged as 68222a3, PR #90 as 99ee734. Builders branch
    # from main directly; the earlier "merge the baseline first" blocker is
    # discharged.
    main_sha: 99ee734af701f87e472229fe0191ac0b1b00e7b5
    wave_two_integration_pr: 89
    wave_two_integration_merge_sha: 68222a3
    companion_completion_pr: 90
    companion_completion_merge_sha: 99ee734af701f87e472229fe0191ac0b1b00e7b5
    build_on: >-
      Each W03 builder branches from main (>= 99ee734), which carries the whole
      wave-two baseline. No pre-branch merge is pending.
  ci_tiers:
    pr_fast:
      workflow: .github/workflows/ci.yml
      runs_on: every pull-request push
      target_minutes: 5
    integration:
      workflow: .github/workflows/integration.yml
      runs_on: PR ready-for-review, label ci:integration, merge_group, manual
      target_minutes: 15
    merge_candidate:
      workflow: .github/workflows/merge-candidate.yml
      runs_on: push to main, label ci:merge-candidate, wave/w03-f-* heads, merge_group, manual
      target_minutes: 20
    nightly:
      workflow: .github/workflows/nightly.yml
      runs_on: nightly schedule, manual
      target_minutes: null
  status: in_progress
  exit_criterion: >-
    A user can give Bartholomew an ordinary Windows task in natural language.
    Bartholomew perceives enough relevant PC state to understand the request and
    represents observation separately from inference; constructs a governed plan;
    proposes each Windows action through the one canonical action envelope
    (proposal -> identity -> capability -> scope -> risk -> authorization ->
    execution -> evidence -> verify), which cannot execute without authorization
    through the defined host boundary and a clear Parking Brake; safely executes
    allowed actions; observes and verifies the resulting Windows state rather than
    assuming success; explains what happened; and uses an explicitly approved
    correction in a later relevant task, with no obsolete, revoked or untrusted
    memory silently granting authority. Demonstrated end-to-end on at least one
    Golden Path on a real Windows desktop, with manual lesson acceptance remaining
    authoritative throughout.

