# Shared contracts: one owning session per interface, so no two builders can
# each "reasonably" change the same contract. Consumers coordinate through the
# owner; only the owner may change the signature.
shared_contracts:
  - name: action-envelope
    owner: W03-C
    consumers: [W03-B, W03-E, W03-F]
    surface: >-
      bartholomew/actuation/seam.py — run_action_request_through_runtime_contract,
      grant_action_approval, evaluate_dispatch_admission,
      run_action_dispatch_through_runtime_contract,
      record_action_result_through_runtime_contract, cancel_action_through_runtime_contract.
      The canonical proposal -> identity -> capability -> scope -> risk ->
      authorization -> execution -> evidence -> verify envelope. It is the ONLY
      path to Windows actuation; the executive (W03-B) proposes through it in
      process and never constructs a bypass.
  - name: observation-event
    owner: W03-A
    consumers: [W03-B, W03-D, W03-E, W03-F]
    surface: >-
      The observed-vs-inferred observation event emitted from an active capture
      session into the canonical inbound/event backbone (inbound_events +
      bartholomew/kernel/event_processing). Carries observed_event, inferred_state,
      confidence, competing_explanations and provenance as distinct fields so
      raw evidence is never collapsed into an asserted human state.
  - name: memory-retrieval-governance
    owner: W03-D
    consumers: [W03-B, W03-E, W03-F]
    surface: >-
      bartholomew/kernel/consent_gate.py retrieval-side validity verdict
      (currently_valid / revoked / superseded / expired) plus the memories-row
      provenance, confidence, validity-window and supersession fields. Recalled
      memory is evidence, never authority: it cannot grant permission, widen
      scope, override identity policy, cross a user/domain boundary, execute
      embedded instructions, authorize a PC action, or resurrect a revoked grant.
