name: CI

# ---------------------------------------------------------------------------
# Tier: PR FAST  (target: under 5 minutes wall-clock)
#
# Ordinary development feedback on every pull-request push. A compact set of
# high-value checks that catch the common regressions and contract violations:
#
#   quality       format/lint/hook set, dependency graph, security floor,
#                 packaging contract (imports, console scripts, declared deps)
#   fast-tests    the DEFAULT test suite (pyproject deselects `integration` and
#                 `slow`) on one Python, parallelised with pytest-xdist, no
#                 coverage instrumentation. Every governance suite that is not
#                 integration-marked runs here: parking brake, consent-bypass
#                 red team, runtime-contract seams, actuation governance and
#                 prohibitions (when present), learning authorization, S8.
#   windows-fast  packaging + lifecycle on a real Windows runner, plus the
#                 Windows actuation suites when the tree carries them
#   smoke         a real uvicorn server answering /healthz, /api/health, /docs
#
# What moved OUT of the PR tier and where (see docs/waves/W03/W03_CI_BASELINE.md):
#   coverage gate, py3.10, integration/slow tests, clean-start lifecycle on
#   Ubuntu   -> integration.yml  (Integration tier)
#   both-Python matrix + Windows full suite      -> merge-candidate.yml
#   serial (non-xdist) runs, py3.12, flake hunt  -> nightly.yml
#
# The former pre-commit.yml and smoke.yml workflows are folded in here: they
# ran the same default suite a third and fourth time per PR.
# ---------------------------------------------------------------------------
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-pr-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # A wide console so Rich/Click do not line-wrap long paths in captured CLI
  # output. Without it, xdist worker tmp paths (…/popen-gw0/…) push the DB-path
  # the brake commands print past an 80-col default and split it mid-token, so
  # a substring assertion like ".../barth.db" fails on ".../ba\nrth.db". The
  # tests are correct; only the rendered width was environment-dependent.
  COLUMNS: "200"
  # The test session enables the deterministic-hash embedder explicitly (see
  # conftest.py); nothing here provisions a real model.
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality (format, lint, packaging contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      # Install from the DECLARED dependency set only (pyproject via -e .),
      # plus dev tooling. requirements.txt is intentionally not used here, so a
      # runtime dependency missing from pyproject fails this job.
      - name: Install package from declared dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: pip check (dependency graph is consistent)
        run: python -m pip check

      - name: Security floor — Starlette >= 1.3.1 (CVE-2026-54283 / GHSA-82w8-qh3p-5jfq)
        run: |
          python -c "
          import sys
          from importlib.metadata import version
          from packaging.version import Version
          installed = Version(version('starlette'))
          minimum = Version('1.3.1')
          if installed < minimum:
              sys.exit(f'starlette {installed} is below the required security floor '
                        f'{minimum} (CVE-2026-54283 / GHSA-82w8-qh3p-5jfq). '
                        f'Check the starlette pin in pyproject.toml.')
          print(f'starlette {installed} OK (>= {minimum})')
          "

      # The pinned hook set (black, ruff, end-of-file-fixer, trailing-whitespace,
      # detect-private-key, check-yaml, check-added-large-files). requirements-dev
      # pins the same ruff/black versions, so this is the one lint authority.
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit (black, ruff, hygiene hooks)
        run: pre-commit run --all-files --show-diff-on-failure

      # Import/CLI/API/undeclared-dependency contract. Fails fast and with an
      # obvious cause before any DB or server work runs.
      - name: Packaging contract (imports, console scripts, declared deps)
        run: python -m pytest tests/smoke/test_packaging_contract.py -p no:cacheprovider

      # Wave coordination manifest stays machine-readable and self-consistent
      # (immutable session ids, branch/PR/handoff naming, acyclic dependencies).
      - name: Wave manifest contract
        if: hashFiles('tests/test_wave_manifest.py') != ''
        run: python -m pytest tests/test_wave_manifest.py -p no:cacheprovider

  fast-tests:
    name: PR Fast tests (Ubuntu, py3.11, parallel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install package (editable) and dev dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      # The default suite (pyproject: -m 'not integration and not slow'),
      # spread over the runner's cores. `--dist loadfile` keeps every test of
      # one module on one worker: several suites share module-level state
      # (the API app's process-wide kernel singleton, the permission-checker
      # singleton) that is safe within a process and unsafe across an
      # interleaving. No coverage instrumentation here: it costs ~30% and its
      # gate is enforced in the Integration and Merge Candidate tiers.
      - name: Default test suite (parallel, no coverage)
        run: >-
          python -m pytest -p no:cacheprovider
          -n auto --dist loadfile
          --junitxml=junit-pr-fast-py3.11.xml

      - name: Upload junit (test timings for tier tuning)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-pr-fast-py3.11
          path: junit-pr-fast-py3.11.xml
          if-no-files-found: ignore
          retention-days: 14

  windows-fast:
    name: Windows fast (packaging, lifecycle, actuation suites)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install package (editable) and dev dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: pip check
        run: python -m pip check

      - name: Packaging contract (imports, console scripts, declared deps)
        run: python -m pytest tests/smoke/test_packaging_contract.py -p no:cacheprovider

      # The Windows-critical properties: database handles released well enough
      # for temp-directory cleanup, bounded start/stop, no leaked threads.
      - name: Clean-start persistence + lifecycle
        run: python -m pytest tests/test_clean_start_lifecycle.py -p no:cacheprovider

      - name: Scheduler startup readiness
        run: python -m pytest tests/test_scheduler_startup_readiness.py -p no:cacheprovider

      # Governed Windows actuation (wave-two package B). Present once the
      # wave-two integration is on the tree; the steps are guarded so this
      # workflow is valid both before and after that merge.
      #
      #   * the real suite uses the actual Win32 API with nothing substituted
      #     -- real CreateProcessW, real EnumWindows, real clipboard -- and is
      #     skipped everywhere else, so without this step it would never run;
      #   * the structural suite is re-run here because the path allowlist and
      #     the executable-extension refusals behave differently under
      #     Windows path semantics.
      - name: Governed Windows actuation (real Win32, nothing substituted)
        if: hashFiles('tests/integration/test_windows_action_real.py') != ''
        run: python -m pytest tests/integration/test_windows_action_real.py -p no:cacheprovider -m integration

      - name: Governed Windows actuation (capabilities, governance, prohibitions)
        if: hashFiles('tests/test_windows_action_governance.py') != ''
        run: >-
          python -m pytest
          tests/test_windows_action_capabilities.py
          tests/test_windows_action_governance.py
          tests/test_windows_action_prohibitions.py
          tests/test_windows_action_channel_separation.py
          tests/test_windows_action_dispatch_results.py
          -p no:cacheprovider

      - name: Smoke tests
        run: python -m pytest -m smoke -p no:cacheprovider

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The only check that boots a real HTTP server process.
      - name: Start uvicorn server
        run: |
          uvicorn app:app --host 127.0.0.1 --port 5173 &
          echo "Server started in background"

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/healthz; then
              echo "Server is ready!"
              break
            fi
            echo "Waiting for server... attempt $i/30"
            sleep 1
          done

      - name: Test /healthz endpoint
        run: |
          response=$(curl -fsS http://127.0.0.1:5173/healthz)
          echo "Response: $response"
          echo "$response" | jq -e '.status == "ok"' || exit 1
          echo "$response" | jq -e '.version == "0.1.0"' || exit 1

      - name: Test /api/health endpoint
        run: curl -fsS http://127.0.0.1:5173/api/health | jq .

      - name: Test /docs endpoint
        run: curl -fsS http://127.0.0.1:5173/docs > /dev/null
