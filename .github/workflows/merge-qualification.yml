name: Merge Qualification

# ---------------------------------------------------------------------------
# The deterministic merge-readiness gate (AUDIT-CTRL-1).
#
# It answers exactly one question: can THIS EXACT HEAD be proven merge-ready?
# It proves nothing itself — it reads the forge's own record of the required
# tiers and the review threads, and the repository's own committed
# disposition records, and refuses unless every one of them says yes.
#
# It deliberately re-runs on every `synchronize`, so a new commit invalidates
# whatever the previous head was qualified for. Evidence from an older head
# cannot authorise a newer one.
#
# This workflow is NOT itself in the required-tier list: a gate cannot be its
# own evidence.
# ---------------------------------------------------------------------------
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to qualify
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: merge-qualification-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  # The self-test runs first and is not allowed to be skipped. If the gate's
  # own regression suite does not pass, the gate's verdict means nothing, so
  # the verdict is never computed.
  gate-self-test:
    name: Merge qualification self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install package (editable) and dev dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: Regression suite for the qualification evaluator
        run: python -m pytest tests/test_merge_qualification.py -p no:cacheprovider

  # Long-running on purpose. The gate requires tiers that take the better
  # part of an hour, so a verdict taken ninety seconds after the push says
  # only that the gate was quicker than CI. `--wait-minutes` makes it wait
  # for the required checks to settle; the verdict is still whatever the last
  # look actually found, and the deadline is well inside the job cap.
  qualify:
    name: Qualify the current head
    needs: gate-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install package (editable)
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      # Read the head from the forge rather than from the checkout: for a
      # pull_request event the checked-out ref is a merge commit that exists
      # nowhere else, and qualification must name the commit reviewers and
      # check runs actually see.
      - name: Resolve the exact current head
        id: head
        env:
          GH_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          echo "pr=${GH_PR}" >> "$GITHUB_OUTPUT"

      - name: Qualify
        id: qualify
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.ci.merge_qualification qualify \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.head.outputs.pr }}" \
            --out merge-qualification-evidence.json \
            --wait-minutes 60 --poll-seconds 60 \
            | tee qualification.txt

      - name: Publish the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-qualification-evidence
          path: |
            merge-qualification-evidence.json
            qualification.txt
          if-no-files-found: ignore
          retention-days: 90

      # The job's own result. `continue-on-error` above exists only so the
      # evidence is always uploaded; the verdict is re-asserted here, and a
      # gate that could not run at all is NOT READY.
      - name: Enforce the verdict
        run: |
          if [ ! -f merge-qualification-evidence.json ]; then
            echo "::error::qualification produced no evidence — failing closed"
            exit 1
          fi
          python - <<'PY'
          import json, sys
          evidence = json.load(open("merge-qualification-evidence.json"))
          if evidence.get("verdict") != "ready":
              print("::error::this head is NOT merge-qualified")
              for reason in evidence.get("reasons", []):
                  print(f"::error::{reason['code']}: {reason['detail']}")
              sys.exit(1)
          print(f"merge-qualified at {evidence['head_sha']}")
          PY
