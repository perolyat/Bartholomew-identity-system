name: pre-commit + smoke

# Runs the pre-commit hook set itself (black, ruff, end-of-file-fixer,
# trailing-whitespace, detect-private-key, check-yaml, check-added-large-files)
# plus the default test suite. Broader verification -- packaging contract,
# Windows, coverage, and the integration/lifecycle tests the default marker
# expression excludes -- lives in ci.yml.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Run smoke tests
        run: pytest -q -m smoke
      # NOTE: pyproject sets addopts = -m 'not integration and not slow', so
      # this is the DEFAULT suite, not literally every test. The excluded
      # integration/slow tests run explicitly in ci.yml's `critical` job.
      - name: Run default test suite (excludes integration/slow markers)
        run: pytest -q
