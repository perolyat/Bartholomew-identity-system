# Bartholomew Embeddings Configuration
# Governs vector embedding behavior for memory retrieval

embeddings:
  # Default provider (local-sbert = offline-first)
  default_provider: local-sbert

  # Default model
  default_model: BAAI/bge-small-en-v1.5

  # Default embedding dimension
  default_dim: 384

  # Provisioned local directory holding the model assets.
  #
  # This is the reproducible deployment path: when set and present on disk,
  # the model is loaded from here rather than resolved through the model hub.
  # Populate it with `bartholomew embeddings provision`. Overridden by the
  # BARTHO_EMBED_MODEL_PATH environment variable, so a deployment can point at
  # its own location without editing tracked configuration.
  model_path: null

  # Whether loading the model may reach the network.
  #
  # Keep this false. Ordinary retrieval must never trigger a model download:
  # startup would depend on an uncontrolled first-run fetch of several hundred
  # megabytes, which is neither reproducible nor offline-first. Fetching model
  # assets is a deliberate bootstrap step (`embeddings provision`), which sets
  # this for its own single operation only.
  allow_download: false

  # Default embedding mode
  # Options: none, summary, full, both
  default_mode: summary

  # Allow remote providers (OpenAI, etc.)
  # Must be true AND env vars set to use network providers
  allow_remote: false

  # Store embeddings by default
  # Set to false for backwards compatibility
  # Individual rules can override via embed_store: true
  store: false

  # IMPORTANT: Embeddings are NOT encrypted at rest
  # This enables ANN search but means vectors are stored in plaintext
  # Mitigation: local-only default, summary-first, OS file security
  encrypt: false

# Notes:
# - To enable embeddings globally, set BARTHO_EMBED_ENABLED=1
# - If the configured model cannot be loaded, embeddings fail CLOSED: no
#   vectors are written and retrieval reports itself as FTS-only. It does not
#   quietly degrade to the deterministic hash embedder -- that serves only when
#   BARTHO_EMBED_ALLOW_FALLBACK=1 is set deliberately, for development and
#   tests, and its vectors are stored and searched as a separate population.
# - `bartholomew embeddings stats` reports which of those states is live.
# - Per-rule overrides in memory_rules.yaml take precedence
# - Embeddings happen AFTER summarization, BEFORE encryption
