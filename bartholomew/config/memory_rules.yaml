# Bartholomew Memory Governance Rules (v2.1 - Phase 2c)
# Supports redaction, encryption routing, and summarization
#
# Encryption policy:
#   encrypt: standard|strong|true|false
#     - standard: AES-GCM 256 with STANDARD key (BME_KEY_STANDARD)
#     - strong:   AES-GCM 256 with STRONG key (BME_KEY_STRONG)
#     - true:     alias of standard
#     - false or omitted: no encryption
#
# Redaction policy:
#   redact: true|false
#   redact_strategy: mask|remove|replace:<text>
#     - mask:    Replace matches with ****
#     - remove:  Delete matches entirely
#     - replace: Replace with custom text after colon
#
# Summarization policy:
#   summarize: true|false
#   summary_mode: summary_only | summary_also | full_always
#     - summary_only:  Only the summary is stored (replaces value)
#     - summary_also:  Both original and summary stored (default)
#     - full_always:   No summarization
#   Auto-triggers for kinds: conversation.transcript, recording.transcript,
#   article.ingested, code.diff, chat when content > 1000 characters

always_keep:
  - match:
      kind: user_profile
    metadata:
      privacy_class: user.identity
      recall_policy: always
      encrypt: standard

  - match:
      key: birthday
    metadata:
      privacy_class: user.essential
      recall_policy: always
      encrypt: standard

  - match:
      kind: user_schedule
    metadata:
      privacy_class: user.intent
      recall_policy: always

  - match:
      tags:
        - health
        - medical
    metadata:
      privacy_class: user.health
      recall_policy: always
      encrypt: strong

  - match:
      kind: safety.audit
    metadata:
      summarize: false
      encrypt: standard
      recall_policy: always

  # Competency kinds (S5.1 data model; written by S5.2's training seam).
  # Purpose is governance LEGIBILITY: without these, competency records rely
  # on an unset/default recall_policy and are invisible to anyone auditing
  # this file. Deliberately minimal -- privacy_class and recall_policy only.
  #
  # These do NOT weaken consent. This engine applies categories in PRIORITY
  # order (never_store, ask_before_store, always_keep, ...) and merges
  # metadata without clobbering fields a higher-priority rule already set, so
  # a competency record whose CONTENT matches an ask_before_store rule below
  # (password/bank/health/personal-data patterns) still gets
  # requires_consent=true -- these always_keep entries cannot override it.
  # Verified by tests/test_training_memory_rules.py.
  #
  # Encryption is deliberately NOT set here: sensitive content inside a
  # competency record is already routed to encryption by the content-pattern
  # rules below, which apply regardless of kind. Blanket-encrypting all
  # competency content would be a scope expansion beyond S5.2's approved
  # design (Sec.7.2) and would change retrieval behaviour for ordinary,
  # non-sensitive procedures.
  - match:
      kind: competency
    metadata:
      privacy_class: user.competency
      recall_policy: always

  - match:
      kind: competency_knowledge
    metadata:
      privacy_class: user.competency
      recall_policy: always

  - match:
      kind: competency_procedure
    metadata:
      privacy_class: user.competency
      recall_policy: always

  - match:
      kind: competency_heuristic
    metadata:
      privacy_class: user.competency
      recall_policy: always

  - match:
      kind: competency_evidence
    metadata:
      privacy_class: user.competency
      recall_policy: always

  # Candidate learning (S5.4 slice; written by the learning seam in
  # runtime_contract). A candidate lesson is what Bartholomew *infers* from
  # one recorded outcome -- proposed, not accepted, and not knowledge.
  #
  # `recall_policy: context_only` rather than `always`, deliberately: it is
  # the strictest value this engine defines, and it says in the one file a
  # governance auditor reads that this kind is not ordinary recallable
  # memory. It is NOT what makes the guarantee, though -- the guarantee is
  # structural and lives in runtime_contract's retrieval filter, which is
  # restricted to COMPETENCY_KINDS + PERSONAL_FACT_KINDS and does not include
  # `candidate_lesson` at all. An accepted lesson becomes retrievable only by
  # being written as a separate `competency_heuristic` record, which is why
  # rejecting a candidate leaves nothing behind for reasoning to find.
  - match:
      kind: candidate_lesson
    metadata:
      privacy_class: user.competency
      recall_policy: context_only

ask_before_store:
  - match:
      content: "(?i)(password|bank|account number|two-factor|auth code)"
    metadata:
      privacy_class: user.secure
      requires_consent: true
      recall_policy: always
      redact: true
      redact_strategy: mask
      encrypt: strong

  - match:
      content: "(?i)(bank|medical|address|phone|email)"
    metadata:
      privacy_class: user.sensitive
      requires_consent: true
      redact: true
      summarize: false
      encrypt: strong

  # Phase 2d Fixpack v3: align paraphrase dataset rows marked
  # privacy_marker=requires_consent with ask_before_store rules by
  # matching on common "personal data" phrasing.
  - match:
      content: "(?i)(personal data|personal information)"
    metadata:
      privacy_class: user.sensitive
      requires_consent: true
      recall_policy: always
      redact: true
      summarize: false
      encrypt: strong

  - match:
      tags:
        - trauma
        - confessional
    metadata:
      privacy_class: user.emotional
      requires_consent: true
      recall_policy: always

  - match:
      speaker: thirdparty
    metadata:
      privacy_class: thirdparty.private
      requires_consent: true
      recall_policy: context_only

auto_expire:
  - match:
      kind: drive_output
    metadata:
      expires_in: 2h
      recall_policy: context_only

  - match:
      kind: environment_observation
    metadata:
      expires_in: 7d
      recall_policy: context_only

  - match:
      tags:
        - transient
        - mood
    metadata:
      expires_in: 3d
      recall_policy: context_only

never_store:
  - match:
      content: "(?i)(child sexual abuse|csam|illegal content)"
    metadata:
      allow_store: false

  - match:
      kind: environment
      content: security camera
    metadata:
      allow_store: false

  - match:
      key: password
      content: "(?i)hunter2"
    metadata:
      allow_store: false

  - match:
      tags:
        - illegal
        - exploit
    metadata:
      allow_store: false

  - match:
      speaker: unknown
    metadata:
      allow_store: false

  # Block “store personal data / personal information” policy sentences
  # used in the hybrid_paraphrases benchmark.
  - match:
      content: "(?i)(personal data|personal information)"
    metadata:
      allow_store: false
      privacy_class: user.sensitive
      recall_policy: never
      redact: true
      encrypt: strong

context_only:
  - match:
      kind: sensitive_joke
    metadata:
      recall_policy: context_only

  - match:
      kind: chat
      tags:
        - smalltalk
    metadata:
      recall_policy: context_only
      summarize: true
      summary_mode: summary_also

  - match:
      tags:
        - politics
        - religious
        - adult
    metadata:
      recall_policy: context_only

# Redact-only rules: Apply redaction without blocking storage
redact:
  - match:
      kind: user
      content: "(?i)my (email|phone|address) is .+"
    metadata:
      redact_strategy: mask
      encrypt: standard
      summarize: true
      summary_mode: summary_also

  - match:
      content: "(?i)ssn:?\\s*\\d{3}-\\d{2}-\\d{4}"
    metadata:
      redact_strategy: replace:[SSN REDACTED]
      encrypt: strong
