timezone: "Australia/Brisbane"
loop_interval_seconds: 15

memory:
  db_path: "data/barth.db"

retrieval:
  mode: "hybrid"  # Options: "hybrid", "vector", "fts"

  # Candidate pool sizes (performance guardrails)
  fts_candidates: 200          # Number of FTS candidates to pull (N)
  vec_candidates: 200          # Number of vector candidates to pull (M)
  top_k: 20                    # Final fused results to return (K)

  # FTS configuration
  fts_tokenizer: "porter"      # FTS5 tokenizer (porter, unicode61, ascii)
  fts_index_mode: "external"   # Index mode (external = external-content)

  # Hybrid fusion settings
  fusion_strategy: "weighted"  # "weighted" or "rrf" (reciprocal rank fusion)
  hybrid_weights:
    fts: 0.6                   # Weight for FTS scores (normalized to sum=1.0)
    vector: 0.4                # Weight for vector scores
    recency: 0.15              # Weight for recency as its own fused term (see
                                # HybridRetriever._normalize_recency_scores()) --
                                # not a raw multiplier on the whole score, so a
                                # strong exact-match/semantic hit can no longer
                                # be completely overridden by age alone
  rrf_k: 60                    # RRF denominator constant (if using rrf strategy)

  # Recency boost (exponential decay)
  recency:
    half_life_days: 7          # Half-life for recency decay (1 week default)

  # Kind-specific boost multipliers (applied to all retrieval scores)
  kind_boosts: {}              # Example: {"event": 1.2, "preference": 1.5}

planner:
  max_actions_per_tick: 1
  allow_proactive: true

quiet_hours:
  start: "21:30"
  end: "07:00"

dreaming:
  nightly_window: "21:00-23:00"
  weekly:
    weekday: "Sun"
    time: "21:30"

# Cadence OVERRIDES only. This block does not register or de-register
# anything -- it names 3 of the 5 always-on drives, and a drive omitted here
# simply runs at its registry default. Registration lives in
# bartholomew/kernel/scheduler/drives.py's resolve_registry().
drives:
  self_check: "every:900"
  curiosity_probe: "window:3600:2"
  reflection_micro: "every:7200"

# Consent to be proactive (Usable POC slice 2 --
# docs/POC_SLICE_2_PROACTIVE_REMINDERS.md).
#
# schedule_reminders: DEFAULT OFF. When false, the schedule_reminder_check
# drive is not registered at all: no ticks, no queue impact, no outbound
# notifications, no behaviour change of any kind. Turning it on is a
# deliberate operator act, and it is the ONLY switch -- there is deliberately
# no environment-variable override, so there is exactly one authority over
# whether Bartholomew may contact you unprompted.
#
# When on, Bartholomew scans stored date-bearing facts hourly and, for each
# item falling due inside look_ahead_days, raises one nudge and sends one
# governed notification. Governance, the parking brake, Identity policy and
# quiet hours/mute all apply unchanged.
#
# look_ahead_days / max_per_tick are provisional POC constants (planning note
# section 7) -- tuned from real use, not frozen here.
proactive:
  schedule_reminders: false
  look_ahead_days: 3
  max_per_tick: 3
